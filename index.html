<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div class="weather-card">
      <h2>Weather Forecast</h2>
      <div class="search-box">
        <select id="citySelect">
          <option value="Ulaanbaatar">Ulaanbaatar</option>
          <option value="Moscow">Moscow</option>
          <option value="Tokyo">Tokyo</option>
          <option value="Beijing">Beijing</option>
          <option value="Seoul">Seoul</option>
        </select>
        <button id="getWeatherBtn">Search</button>
      </div>

      <div class="weather-info" id="weatherInfo">
        <h3 id="cityName">Ulaanbaatar</h3>
        <p id="dateInfo" class="date-text"></p>

        <div class="weather-icon" id="weatherIcon">☀️</div>
        <div class="temp" id="temp">0°C</div>
        <p id="description">Weather condition</p>
        <div class="details">
          <p>Humidity: <span id="humidity">0%</span></p>
          <p>Wind: <span id="wind">0 m/s</span></p>
        </div>
      </div>
    </div>

    <script src="/index.js"></script>
  </body>
</html>
